#
# PIC32MX795 CNC Configuration with XC32
#
[env:pic32mx795_cnc]
platform = microchippic32
board = ubw32_mx795
framework = arduino
board_build.core = pic32
debug_tool = pic32
build_src_filter = ${common.default_src_filter} +<src/HAL/PIC32> +<src/pins/pic32>
build_flags = -DMOTHERBOARD=BOARD_RAMPS_14_EFB
  -D__MARLIN_FIRMWARE__
  -DHAL_PIC32
  -DF_CPU=80000000UL
  -DARDUINO_ARCH_PIC32
  -DPLATFORM_PIC32
  -DPIC32MX795
  -mcpu=32MX795F512L
  -toolchain xc32
  -Xc32